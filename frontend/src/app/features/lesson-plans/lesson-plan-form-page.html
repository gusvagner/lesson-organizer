<a mat-button class="back" routerLink="/lesson-plans">
  <mat-icon>arrow_back</mat-icon>
  Lesson plans
</a>
<header class="page-header">
  <h1>{{ id() ? 'Edit lesson plan' : 'New lesson plan' }}</h1>
  @if (plan(); as current) {
    <span class="status">Status: {{ current.status | lessonPlanStatusLabel }}</span>
  }
</header>

@if (studentsLoaded()) {
  @if (studentsStore.students().length === 0) {
    <lo-empty-state
      icon="person_add"
      message="Create a student first. Every lesson plan belongs to a student."
      actionLabel="Create a student first"
      (action)="goToNewStudent()"
    />
  } @else if (!id() || plan()) {
    <lo-lesson-plan-form
      [plan]="plan()"
      [students]="studentsStore.students()"
      [preselectedStudentId]="preselectedStudentId()"
      [saving]="store.saving()"
      [problem]="problem()"
      (save)="save($event)"
    />
  }
}
