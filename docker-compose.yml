name: lesson-organizer

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: "localhost;127.0.0.1"
      ConnectionStrings__LessonOrganizer: "Server=db,1433;Database=LessonOrganizer;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true"
      Database__MigrateOnStartup: "true"
      Seed__DemoData: "true"
      DataProtection__KeysPath: /home/app/keys
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dp-keys:/home/app/keys

volumes:
  mssql-data:
  dp-keys:
